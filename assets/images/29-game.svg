<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">29 F# multiplayer card game</title>
  <desc id="desc">A stylized green card table with four players and F# playing cards</desc>
