    <circle cx="88" cy="76" r="42" fill="#0f172a" stroke="#22d3ee"/>
    <circle cx="246" cy="160" r="58" fill="#1e1b4b" stroke="#a78bfa"/>
    <circle cx="356" cy="70" r="40" fill="#0f172a" stroke="#34d399"/>
    <circle cx="122" cy="306" r="48" fill="#0f172a" stroke="#38bdf8"/>
    <circle cx="378" cy="294" r="48" fill="#0f172a" stroke="#f472b6"/>
    <text x="246" y="168" text-anchor="middle" fill="#fff" stroke="none" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700">recall</text>
  </g>
  <g transform="translate(790 605)" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="18">
    <text x="0" y="0">PostgreSQL</text><text x="142" y="0">pgvector</text><text x="260" y="0">Apache AGE</text>
