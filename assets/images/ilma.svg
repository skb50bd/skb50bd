<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ilma agent memory system</title>
  <desc id="desc">Abstract memory graph and search interface on a dark indigo background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1100" cy="70" r="250" fill="#7c3aed" opacity=".12"/>
  <circle cx="120" cy="650" r="240" fill="#06b6d4" opacity=".09"/>
  <g transform="translate(74 68)">
    <text x="0" y="62" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="64" font-weight="800">ilma</text>
    <text x="2" y="102" fill="#a5b4fc" font-family="Inter,system-ui,sans-serif" font-size="22" letter-spacing="3">AGENT MEMORY, WITHOUT THE FRAMEWORK TAX</text>
  </g>
  <g transform="translate(74 220)">
    <rect width="590" height="410" rx="28" fill="url(#card)" stroke="#475569"/>
    <text x="34" y="55" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="18">ilma recall "deployment preferences"</text>
    <rect x="32" y="82" width="526" height="82" rx="15" fill="#172554" stroke="#3730a3"/>
    <circle cx="66" cy="123" r="13" fill="#22d3ee"/>
    <text x="94" y="116" fill="#e2e8f0" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="700">Memory</text>
    <text x="94" y="143" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="16">Production services run rootless.</text>
    <rect x="32" y="181" width="526" height="82" rx="15" fill="#1e1b4b" stroke="#5b21b6"/>
    <circle cx="66" cy="222" r="13" fill="#a78bfa"/>
