    <text x="94" y="242" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="16">Verified deployment workflow</text>
    <rect x="32" y="280" width="526" height="96" rx="15" fill="#0f2f35" stroke="#0f766e"/>
    <text x="55" y="317" fill="#5eead4" font-family="ui-monospace,monospace" font-size="16">vector + FTS + graph</text>
    <rect x="55" y="338" width="405" height="8" rx="4" fill="#164e63"/><rect x="55" y="338" width="344" height="8" rx="4" fill="#22d3ee"/>
  </g>
