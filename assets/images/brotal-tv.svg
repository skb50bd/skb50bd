<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Brotal TV streaming platform</title>
  <desc id="desc">Live television player and channel dashboard on a dark cinematic background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#2a0a12"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset=".5" stop-color="#0f766e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="260" fill="#e11d48" opacity=".1"/>
  <g transform="translate(70 58)">
