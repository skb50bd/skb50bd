      <rect x="18" y="244" width="244" height="72" rx="14" fill="#27272a"/><circle cx="52" cy="280" r="18" fill="#7c3aed"/><text x="82" y="276" fill="#e4e4e7" font-weight="700">Cinema</text><text x="82" y="298" fill="#71717a">HD</text>
